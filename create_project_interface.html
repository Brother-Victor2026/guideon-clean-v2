<!-- MODALE INTERACTIVE CRÉER UN PROJET (STYLE CHATGPT) -->
<div id="createProjectInterface" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10000;justify-content:center;align-items:center;">
  <div style="background:#0f0f1a;border:1px solid #2d1b69;border-radius:16px;padding:24px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;">
    
    <!-- HEADER -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h1 style="color:#a78bfa;margin:0;font-size:20px;">Nouveau projet</h1>
      <button onclick="closeCreateProjectInterface()" style="background:none;border:none;color:#9ca3af;font-size:24px;cursor:pointer;">✕</button>
    </div>
    
    <!-- INPUT PRINCIPAL -->
    <input id="projectMainInput" type="text" placeholder="par exemple, planification d'un anniversaire" style="width:100%;padding:12px;background:#1a1a2e;border:1px solid #2d1b69;border-radius:8px;color:#fff;font-size:14px;box-sizing:border-box;margin-bottom:20px;">
    
    <!-- CATÉGORIES -->
    <p style="color:#a78bfa;font-weight:bold;margin:0 0 12px 0;font-size:12px;">Sélectionne une catégorie:</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;">
      <button class="categoryBtn" onclick="selectCategory('devoirs', this)" style="padding:10px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;font-size:12px;transition:all 0.3s;">🏠 Devoirs</button>
      <button class="categoryBtn" onclick="selectCategory('investissement', this)" style="padding:10px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;font-size:12px;transition:all 0.3s;">💰 Investissement</button>
      <button class="categoryBtn" onclick="selectCategory('ecriture', this)" style="padding:10px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;font-size:12px;transition:all 0.3s;">✏️ Écriture</button>
      <button class="categoryBtn" onclick="selectCategory('sante', this)" style="padding:10px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;font-size:12px;transition:all 0.3s;">🏥 Santé</button>
      <button class="categoryBtn" onclick="selectCategory('voyages', this)" style="padding:10px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;font-size:12px;transition:all 0.3s;">✈️ Voyages</button>
      <button class="categoryBtn" onclick="selectCategory('autre', this)" style="padding:10px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;font-size:12px;transition:all 0.3s;">🎯 Autre</button>
    </div>
    
    <!-- TEXTAREA DESCRIPTION -->
    <p style="color:#a78bfa;font-weight:bold;margin:0 0 8px 0;font-size:12px;">Description du projet (optionnel):</p>
    <textarea id="projectDesc" placeholder="Ajoute plus de détails sur ton projet..." style="width:100%;padding:12px;background:#1a1a2e;border:1px solid #2d1b69;border-radius:8px;color:#fff;font-size:12px;box-sizing:border-box;margin-bottom:20px;height:120px;resize:none;"></textarea>
    
    <!-- OPTIONS SUPPLÉMENTAIRES -->
    <p style="color:#a78bfa;font-weight:bold;margin:0 0 12px 0;font-size:12px;">Options supplémentaires:</p>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#9ca3af;font-size:12px;cursor:pointer;">
      <input type="radio" name="newProjectMode" value="default" id="newModeDef" checked style="cursor:pointer;">
      <span><strong>Par défaut</strong> - Accès aux éléments d'autres chats</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:20px;color:#9ca3af;font-size:12px;cursor:pointer;">
      <input type="radio" name="newProjectMode" value="only" id="newModeOnly" style="cursor:pointer;">
      <span><strong>Projet seulement</strong> - Éléments visibles seulement ici</span>
    </label>
    
    <!-- BOUTONS ACTION -->
    <div style="display:flex;gap:10px;">
      <button onclick="saveNewProject()" style="flex:1;padding:12px;background:#a78bfa;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;">✅ Créer un projet</button>
      <button onclick="closeCreateProjectInterface()" style="flex:1;padding:12px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;font-size:14px;">❌ Annuler</button>
    </div>
  </div>
</div>
