<!-- SECTION PROJETS -->
<div style="margin-bottom:20px;padding:12px;border-top:1px solid #2d1b69;">
  <h3 style="color:#a78bfa;margin:0 0 12px 0;">📂 Projets</h3>
  <button class="pb" onclick="createNewProject()" style="margin-bottom:6px;width:100%;">➕ Créer un nouveau projet</button>
  <button class="pb" onclick="showMyProjects()" style="width:100%;">📋 Voir mes projets</button>
</div>

<!-- DESCRIPTION GUIDÉON + OPTIONS -->
<div style="margin-bottom:20px;padding:12px;background:#0f0f1a;border-radius:8px;border-left:3px solid #a78bfa;">
  <p style="color:#a78bfa;font-weight:bold;margin:0 0 8px 0;">🧠 Guidéon</p>
  <p style="color:#9ca3af;font-size:12px;margin:0 0 10px 0;">Ton assistant IA personnel intelligent, sage et bienveillant.</p>
  <p style="color:#9ca3af;font-size:12px;margin:0 0 10px 0;">Les projets fournissent à Guidéon un contexte partagé pour les chats et fichiers, en un seul endroit.</p>
  
  <p style="color:#a78bfa;font-weight:bold;font-size:12px;margin:12px 0 8px 0;">Options supplémentaires:</p>
  
  <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#9ca3af;font-size:12px;cursor:pointer;">
    <input type="radio" name="projectMode" value="default" id="modeDefault" checked onchange="saveProjectMode('default')" style="cursor:pointer;">
    <span><strong>Par défaut</strong><br>Le projet peut accéder à des éléments mémorisés provenant d'autres chats, et vice versa.</span>
  </label>
  
  <label style="display:flex;align-items:center;gap:8px;color:#9ca3af;font-size:12px;cursor:pointer;">
    <input type="radio" name="projectMode" value="only" id="modeOnly" onchange="saveProjectMode('only')" style="cursor:pointer;">
    <span><strong>Projet seulement</strong><br>Le projet ne peut accéder qu'à ses propres éléments mémorisés. Ils ne sont pas visibles par d'autres chats.</span>
  </label>
</div>
