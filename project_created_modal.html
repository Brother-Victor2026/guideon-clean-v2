<!-- MODALE 3: PROJET CRÉÉ AVEC SUCCÈS -->
<div id="projectCreatedModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10002;justify-content:center;align-items:center;">
  <div style="background:#0f0f1a;border:1px solid #2d1b69;border-radius:12px;padding:20px;width:85%;max-width:350px;">
    <h2 style="color:#65a30d;margin:0 0 15px 0;font-size:16px;">✅ Projet créé avec succès!</h2>
    <p id="projectCreatedName" style="color:#9ca3af;margin:0 0 20px 0;font-size:13px;"></p>
    <div style="display:flex;gap:10px;">
      <button onclick="closeProjectCreatedModal()" style="flex:1;padding:10px;background:#a78bfa;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">✅ OK</button>
      <button onclick="cancelProjectCreation()" style="flex:1;padding:10px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;">❌ Annuler</button>
    </div>
  </div>
</div>
