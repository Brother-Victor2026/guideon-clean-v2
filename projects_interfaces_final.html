<!-- MODALE 1: CONFIRMATION CATÉGORIE -->
<div id="confirmCategoryModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10001;justify-content:center;align-items:center;">
  <div style="background:#0f0f1a;border:1px solid #2d1b69;border-radius:12px;padding:20px;width:85%;max-width:350px;">
    <h2 style="color:#a78bfa;margin:0 0 15px 0;font-size:16px;">Confirmer la catégorie?</h2>
    <p id="confirmCategoryText" style="color:#9ca3af;margin:0 0 20px 0;font-size:13px;"></p>
    <div style="display:flex;gap:10px;">
      <button onclick="confirmCategory()" style="flex:1;padding:10px;background:#a78bfa;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">✅ OK</button>
      <button onclick="closeConfirmCategory()" style="flex:1;padding:10px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;">❌ Annuler</button>
    </div>
  </div>
</div>

<!-- MODALE 2: VOIR MES PROJETS -->
<div id="myProjectsModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10000;justify-content:center;align-items:center;">
  <div style="background:#0f0f1a;border:1px solid #2d1b69;border-radius:12px;padding:20px;width:90%;max-width:450px;max-height:80vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
      <h2 style="color:#a78bfa;margin:0;font-size:16px;">📂 Mes Projets</h2>
      <button onclick="closeMyProjectsModal()" style="background:none;border:none;color:#9ca3af;font-size:20px;cursor:pointer;">✕</button>
    </div>
    
    <div id="projectsListContainer" style="margin-bottom:15px;"></div>
    
    <button onclick="closeMyProjectsModal()" style="width:100%;padding:10px;background:#2d1b69;color:#fff;border:1px solid #a78bfa;border-radius:8px;cursor:pointer;font-size:13px;">❌ Fermer</button>
  </div>
</div>
